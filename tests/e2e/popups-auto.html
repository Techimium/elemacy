<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Elemacy popups: automatic opening, fault isolation, ids</title>
<link rel="stylesheet" href="popups.css">
<style>@keyframes none-needed{from{opacity:1}to{opacity:1}}</style>
</head>
<body>
  <!-- 201: page_load (delay 0) + a test-registered "auto" trigger + a click trigger -->
  <div class="elemacy-popup elemacy-popup-201 elemacy-popup--floating" data-elemacy-popup-id="201" data-elemacy-popup-type="floating" aria-hidden="true" hidden>
    <template class="elemacy-popup-tpl"><div class="elementor elementor-201" style="width:200px"><p>auto popup</p></div></template>
  </div>
  <!-- 202: a trigger whose handler throws; 203: a rule whose handler throws; both also page_load/default -->
  <div class="elemacy-popup elemacy-popup-202 elemacy-popup--floating" data-elemacy-popup-id="202" data-elemacy-popup-type="floating" aria-hidden="true" hidden>
    <template class="elemacy-popup-tpl"><div class="elementor elementor-202" style="width:200px"><p>boom trigger</p></div></template>
  </div>
  <div class="elemacy-popup elemacy-popup-203 elemacy-popup--floating" data-elemacy-popup-id="203" data-elemacy-popup-type="floating" aria-hidden="true" hidden>
    <template class="elemacy-popup-tpl"><div class="elementor elementor-203" style="width:200px"><p>boom rule</p></div></template>
  </div>
  <!-- 204: click-opened; 205: opened then destroyed; 206: animated, closed while still opening -->
  <div class="elemacy-popup elemacy-popup-204 elemacy-popup--floating" data-elemacy-popup-id="204" data-elemacy-popup-type="floating" aria-hidden="true" hidden>
    <template class="elemacy-popup-tpl"><div class="elementor elementor-204" style="width:200px"><p>closed event</p></div></template>
  </div>
  <div class="elemacy-popup elemacy-popup-205 elemacy-popup--floating" data-elemacy-popup-id="205" data-elemacy-popup-type="floating" aria-hidden="true" hidden>
    <template class="elemacy-popup-tpl"><div class="elementor elementor-205" style="width:200px"><p>destroyed</p></div></template>
  </div>
  <div class="elemacy-popup elemacy-popup-206 elemacy-popup--floating" data-elemacy-popup-id="206" data-elemacy-popup-type="floating" aria-hidden="true" hidden>
    <template class="elemacy-popup-tpl"><div class="elementor elementor-206" style="width:200px"><p>interrupted</p></div></template>
  </div>
  <!-- 207: modal opened with a string id -->
  <div class="elemacy-popup elemacy-popup-207 elemacy-popup--popup" data-elemacy-popup-id="207" data-elemacy-popup-type="popup" role="dialog" aria-modal="true" aria-label="Popup 207" aria-hidden="true" hidden>
    <template class="elemacy-popup-tpl"><div class="elementor elementor-207" style="width:200px"><p>string id</p></div></template>
  </div>
  <!-- 208: waits for a trigger no extension ever registers (debug warning) -->
  <div class="elemacy-popup elemacy-popup-208 elemacy-popup--floating" data-elemacy-popup-id="208" data-elemacy-popup-type="floating" aria-hidden="true" hidden>
    <template class="elemacy-popup-tpl"><div class="elementor elementor-208" style="width:200px"><p>waiting</p></div></template>
  </div>

  <button type="button" class="reopen-201">reopen 201</button>
  <button type="button" class="open-204">open 204</button>

  <script>
    var display = function (animation) {
      return {
        position: 'bottom-right', sticky: false,
        overlay: { enabled: false, color: '#000000', opacity: 0.6, blur: 0 },
        animation: animation || { in: 'none', out: 'none' },
        close: { button: true, auto_close_s: 0, on_overlay_click: false, on_esc: true },
        prevent_body_scroll: false, z_index: 9999
      };
    };
    window.elemacyPopupsConfig = {
      debug: true,
      popups: [
        { id: 201, type: 'floating', modal: false, rules: [], display: display(), storage_key: 'elemacy_1_popup_201',
          triggers: [{ type: 'page_load', delay: 0 }, { type: 'auto' }, { type: 'click', selector: '.reopen-201' }] },
        { id: 202, type: 'floating', modal: false, rules: [], display: display(), storage_key: 'elemacy_1_popup_202',
          triggers: [{ type: 'boom' }] },
        { id: 203, type: 'floating', modal: false, display: display(), storage_key: 'elemacy_1_popup_203',
          triggers: [{ type: 'page_load', delay: 0 }], rules: [{ type: 'explode' }] },
        { id: 204, type: 'floating', modal: false, rules: [], display: display(), storage_key: 'elemacy_1_popup_204',
          triggers: [{ type: 'click', selector: '.open-204' }] },
        { id: 205, type: 'floating', modal: false, rules: [], display: display(), storage_key: 'elemacy_1_popup_205',
          triggers: [{ type: 'click', selector: '.never' }] },
        { id: 206, type: 'floating', modal: false, rules: [], display: display({ in: 'fade', out: 'fade' }), storage_key: 'elemacy_1_popup_206',
          triggers: [{ type: 'click', selector: '.never' }] },
        { id: 207, type: 'popup', modal: true, rules: [], storage_key: 'elemacy_1_popup_207',
          display: Object.assign(display(), { overlay: { enabled: true, color: '#000000', opacity: 0.6, blur: 0 }, prevent_body_scroll: true }),
          triggers: [{ type: 'click', selector: '.never' }] },
        { id: 208, type: 'floating', modal: false, rules: [], display: display(), storage_key: 'elemacy_1_popup_208',
          triggers: [{ type: 'never_registered' }] }
      ],
      i18n: { close: 'Close' }
    };

    window.__events = [];
    ['opened', 'closed', 'destroyed'].forEach(function (name) {
      document.addEventListener('elemacy-popup:' + name, function (e) {
        window.__events.push([name, e.detail.id, e.detail.wasShown, typeof e.detail.id]);
      });
    });
    window.__cleanups = 0;
    window.__autoApis = {};
  </script>
  <script src="engine.js"></script>
  <script>
    // Handlers registered after engine.js, before DOMContentLoaded.
    window.elemacyPopups.registerTrigger('auto', function (id, params, api) {
      window.__autoApis[id] = api;
      api.onCleanup(function () { window.__cleanups++; });
    });
    window.elemacyPopups.registerTrigger('boom', function () { throw new Error('trigger handler exploded'); });
    window.elemacyPopups.registerRule('explode', function () { throw new Error('rule handler exploded'); });
  </script>
</body>
</html>
