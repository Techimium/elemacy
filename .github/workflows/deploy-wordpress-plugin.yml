name: Deploy WordPress Plugin

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and stage SVN changes without publishing (select a version tag)
        type: boolean
        default: true

permissions:
  contents: read

# Serialize releases; never cancel a deployment while it is committing to SVN.
concurrency:
  group: wordpress-org-elemacy
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Require a stable version tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Validate release ref
        id: tag
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != tag || ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Select or push a stable version tag such as v1.0.0.'
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  verify:
    name: Test the tagged revision and its production ZIP
    needs: preflight
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy the tested production ZIP to WordPress.org
    needs: [preflight, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLUGIN_VERSION: ${{ needs.preflight.outputs.version }}
      ASSETS_DIR: wp-assets
    steps:
      - name: Checkout tagged source for release checks and listing assets
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the exact ZIP tested by CI
        uses: actions/download-artifact@v4
        with:
          name: elemacy-package-${{ github.sha }}
          path: build

      - name: Verify and extract the tested distribution
        run: |
          set -euo pipefail
          archive="build/elemacy-${PLUGIN_VERSION}.zip"
          python3 src-react/scripts/verify-package.py "$archive" --release-revision "$GITHUB_SHA" --tag "$GITHUB_REF_NAME"
          mkdir -p build/distribution
          unzip -q "$archive" -d build/distribution

      - name: Install SVN
        run: sudo apt-get update && sudo apt-get install -y subversion rsync

      - name: Stage and publish one atomic SVN release
        env:
          WPORG_USERNAME: ${{ secrets.WPORG_USERNAME }}
          WPORG_PASSWORD: ${{ secrets.WPORG_PASSWORD }}
          SVN_URL: ${{ secrets.WPORG_SVN_URL }}
          DISTRIBUTION_DIR: build/distribution/elemacy
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: bash .github/scripts/deploy-wordpress.sh
