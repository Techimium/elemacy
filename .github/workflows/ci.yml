name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  php:
    name: PHP ${{ matrix.php }} — lint, standards, unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 7.4 is the declared floor; 8.3 covers current hosts.
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
        with:
          # The release-gate regression builds a deliberately stale artifact from HEAD~1.
          fetch-depth: 2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Syntax lint every PHP file
        run: |
          find . \( -name vendor -o -name node_modules \) -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Coding standards + PHP compatibility (PHPCS)
        # One run is enough — testVersion 7.4- in phpcs.xml covers the range.
        if: matrix.php == '8.3'
        run: vendor/bin/phpcs -q

      - name: Unit tests
        run: php tests/php/run.php

      - name: Architecture check
        run: php tests/architecture/check.php

      - name: Release gate regressions (stale, dirty and manifest-less archives)
        run: python3 tests/release/verify-package-test.py

  admin-app:
    name: Admin app — typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src-react/package-lock.json

      - name: Install, lint, build
        working-directory: src-react
        run: |
          npm ci
          npm run lint
          npm run build

  e2e:
    name: Popups engine — browser E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Setup Chromium
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run engine suite
        working-directory: tests/e2e
        env:
          ELEMACY_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          npm ci
          npm test

  elementor-compatibility:
    name: Elementor ${{ matrix.elementor }} — real WordPress integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # task 9.6: the oldest and newest Elementor releases the required
        # fixtures have actually been run against and confirmed passing.
        # CompatibilityChecker::MIN_ELEMENTOR_VERSION must track the "min"
        # entry — bumping either pin is a deliberate, re-verified decision,
        # not an automatic "latest" tracker (design.md D9).
        include:
          - label: min
            elementor: '3.35.9'
          - label: current
            elementor: '4.2.3'
    steps:
      - uses: actions/checkout@v4
        with:
          path: elemacy

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer, wp-cli
          extensions: mysqli

      - name: Install Composer dependencies
        working-directory: elemacy
        run: composer install --no-interaction --prefer-dist

      - name: Download WordPress core
        # Pinned, not "latest": a moving WordPress core would make this job's
        # pass/fail depend on which day it ran, the same reproducibility
        # concern design.md raises for cross-plugin pins.
        run: wp core download --path=wordpress-core --skip-content --version=7.1

      - name: Download Elementor ${{ matrix.elementor }}
        run: |
          mkdir -p wordpress-core/wp-content/plugins
          curl -sSL "https://downloads.wordpress.org/plugin/elementor.${{ matrix.elementor }}.zip" -o elementor.zip
          unzip -q elementor.zip -d wordpress-core/wp-content/plugins

      - name: Download the real themes
        # Pinned like core, so a theme update cannot change a result on its
        # own. tests/integration/real-theme-chrome.php runs the three
        # header/footer cases against each: Hello, six themes with a dedicated
        # adapter, five that use the generic path, and a block theme. Astra is
        # not here: the harness keeps the slug `astra` for its fixture theme.
        run: |
          mkdir -p real-themes
          for theme in \
            generatepress.3.6.1 kadence.1.5.2 neve.4.2.16 oceanwp.4.2.7 blocksy.2.1.60 storefront.4.6.2 \
            twentytwentyone.2.9 twentytwenty.3.2 hestia.3.3.8 sydney.2.72 zakra.4.3.3 \
            hello-elementor.3.5.1; do
            curl -sSfL "https://downloads.wordpress.org/theme/$theme.zip" -o "$theme.zip"
            unzip -q "$theme.zip" -d real-themes
          done
          curl -sSfL "https://downloads.wordpress.org/theme/twentytwentyfive.1.5.zip" -o twentytwentyfive.zip
          unzip -q twentytwentyfive.zip -d wordpress-core/wp-content/themes

      - name: Provision disposable environment
        working-directory: elemacy
        run: |
          python3 tests/integration/setup.py \
            --wordpress-source "$GITHUB_WORKSPACE/wordpress-core" \
            --port 8897 \
            --hello-elementor-theme "$GITHUB_WORKSPACE/real-themes/hello-elementor" \
            --theme "$GITHUB_WORKSPACE/real-themes/generatepress" \
            --theme "$GITHUB_WORKSPACE/real-themes/kadence" \
            --theme "$GITHUB_WORKSPACE/real-themes/neve" \
            --theme "$GITHUB_WORKSPACE/real-themes/oceanwp" \
            --theme "$GITHUB_WORKSPACE/real-themes/blocksy" \
            --theme "$GITHUB_WORKSPACE/real-themes/storefront" \
            --theme "$GITHUB_WORKSPACE/real-themes/twentytwentyone" \
            --theme "$GITHUB_WORKSPACE/real-themes/twentytwenty" \
            --theme "$GITHUB_WORKSPACE/real-themes/hestia" \
            --theme "$GITHUB_WORKSPACE/real-themes/sydney" \
            --theme "$GITHUB_WORKSPACE/real-themes/zakra" \
            --private-mysql | tee /tmp/setup-output.log
          grep '^ELEMACY_TEST_ENV=' /tmp/setup-output.log >> "$GITHUB_ENV"

      - name: Real WordPress/Elementor integration suite
        # requires-acf-pro-tagged scenarios need a licensed ACF Pro
        # installation (its repeater field type isn't in the free ACF
        # package) this public job doesn't have; run with --acf-plugin
        # locally for that coverage (see tests/integration/README.md). This
        # job still covers document lifecycle, theme/popup asset preparation,
        # library persistence, the Elementor compatibility surface and
        # Post Content restoration against each matrix Elementor version.
        working-directory: elemacy
        run: php tests/integration/run.php --exclude-group requires-acf-pro

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: elemacy/tests/e2e/package-lock.json

      - name: Setup Chromium
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Real-browser popup and Loop Grid AJAX hydration
        working-directory: elemacy/tests/e2e
        env:
          ELEMACY_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          npm ci
          node run-builders.mjs
          node run-popup-assets.mjs
          node run-loop-pagination.mjs
          node run-form-submissions.mjs
          node run-editor-template-styles.mjs

  package:
    name: Verify the generated Free archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: elemacy
          ref: ${{ github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer, wp-cli
          extensions: mysqli
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Locked dependencies and production package
        working-directory: elemacy
        run: |
          composer install --no-interaction --prefer-dist
          npm ci --prefix src-react
          npm run build:zip --prefix src-react
          python3 src-react/scripts/verify-package.py build/elemacy-*.zip --check-missing-tools
      - name: Install exact ZIP in clean WordPress
        working-directory: elemacy
        run: |
          wp core download --path=/tmp/elemacy-package-core --version=7.1 --skip-content
          mkdir -p /tmp/elemacy-package-core/wp-content/plugins
          curl --fail --silent --show-error --location https://downloads.wordpress.org/plugin/elementor.4.2.3.zip -o /tmp/elementor.zip
          unzip -q /tmp/elementor.zip -d /tmp/elemacy-package-core/wp-content/plugins
          python3 tests/integration/setup.py --private-mysql --wordpress-source /tmp/elemacy-package-core --free-zip build/elemacy-*.zip | tee /tmp/elemacy-package-setup.log
          grep '^ELEMACY_TEST_ENV=' /tmp/elemacy-package-setup.log >> "$GITHUB_ENV"
      - name: Verify installed archive
        working-directory: elemacy
        run: php tests/integration/run.php --exclude-group requires-acf-pro
      - name: WordPress.org Plugin Check on the installed archive
        # Error-level findings fail the release; warnings are reported and, when
        # accepted with a reason, recorded in docs/RELEASE.md.
        working-directory: elemacy
        run: |
          SITE=$(dirname "$ELEMACY_TEST_ENV")/wordpress
          # The disposable site blocks outbound HTTP, so fetch the checker here and install the local file.
          curl --fail --silent --show-error --location https://downloads.wordpress.org/plugin/plugin-check.latest-stable.zip -o /tmp/plugin-check.zip
          wp --path="$SITE" plugin install /tmp/plugin-check.zip --activate
          wp --path="$SITE" plugin check elemacy --format=table | tee build/plugin-check.txt
          if grep -qP '^\d+\t\d+\tERROR\t' build/plugin-check.txt; then echo 'Plugin Check reported errors'; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elemacy-package-${{ github.sha }}
          path: |
            elemacy/build/*.zip*
            elemacy/build/plugin-check.txt
